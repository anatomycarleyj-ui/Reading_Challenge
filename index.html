ne}.center strong{font-size:25px;line-height:1;font-weight:700;letter-spacing:-.025em}.center span{margin-top:6px;color:var(--muted);font-size:13px}.legend{display:grid;gap:8px}.legend-row{display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:center;min-height:24px}.dot{width:9px;height:9px;border-radius:2px}.legend-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.legend-value{color:var(--muted);font-variant-numeric:tabular-nums}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:40px 2px 8px}.section-head h2{font-size:15px;margin:0;font-weight:650}.section-head span{color:var(--muted);font-size:13px}.list{border-top:1px solid var(--border)}.row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;min-height:44px;border-bottom:1px solid var(--border);padding:6px 4px}.num{color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}.row-link{color:var(--text);text-decoration:none;min-width:0}.row-link:hover{text-decoration:underline}.book-title{font-weight:520;white-space:normal;overflow:visible;overflow-wrap:anywhere}.book-meta{font-size:12px;color:var(--muted);white-space:normal;overflow:visible;overflow-wrap:anywhere;margin-top:1px}.status{font-size:12px;padding:3px 8px;border-radius:5px;background:var(--surface);color:var(--muted);white-space:nowrap}.status.read{background:#e8f1ec;color:#2f7652}.status.reading{background:#fbebde;color:#9b612f}.empty{padding:28px 8px;color:var(--muted);text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

(() => {
  const palette=['#5e9fe8','#eac26b','#72bc8f','#bf8eda','#de9255','#df84a8','#4fb9c9','#e97366','#8f8f8c','#b4b4b0'];
  const yearOrder=['2026','2025','2024','< 2023'];
  const yearMap=new Map(DATA.years.map(y=>[y.label,y]));
  const buttons=document.getElementById('years');
  const segments=document.getElementById('segments');
  const legend=document.getElementById('legend');
  const list=document.getElementById('list');
  const radius=46, circumference=2*Math.PI*radius;
  function labelForYear(label){return label}
  function render(label){
    const year=yearMap.get(label); if(!year)return;
    [...buttons.children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.year===label)));
    const books=DATA.books.filter(b=>b.year===label).sort((a,b)=>{
      const av=a.number??9999,bv=b.number??9999;
      return label==='2026'?bv-av:av-bv;
    });
    const counts=new Map();
    books.forEach(book=>book.genres.forEach(g=>counts.set(g,(counts.get(g)||0)+1)));
    const genreRows=[...counts.entries()].sort((a,b)=>b[1]-a[1]);
    const total=genreRows.reduce((sum,row)=>sum+row[1],0)||1;
    segments.innerHTML=''; legend.innerHTML='';
    let offset=0;
    genreRows.forEach(([name,value],i)=>{
      const length=value/total*circumference;
      const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('class','segment'); circle.setAttribute('cx','60'); circle.setAttribute('cy','60'); circle.setAttribute('r',String(radius));
      circle.setAttribute('stroke',palette[i%palette.length]); circle.setAttribute('stroke-dasharray',`${length} ${circumference-length}`); circle.setAttribute('stroke-dashoffset',String(-offset));
      const title=document.createElementNS('http://www.w3.org/2000/svg','title'); title.textContent=`${name}: ${value}`; circle.appendChild(title); segments.appendChild(circle); offset+=length;
      const row=document.createElement('div'); row.className='legend-row'; row.innerHTML=`<span class="dot" style="background:${palette[i%palette.length]}"></span><span class="legend-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span><span class="legend-value">${value}</span>`; legend.appendChild(row);
    });
    const percent=year.goal?Math.round(year.read/year.goal*100):0;
    document.getElementById('progress-percent').textContent=`${percent}% complete`;
    document.getElementById('progress-summary-label').textContent=`${year.read} of ${year.goal} books`;
    document.getElementById('progress-fill').style.width=`${Math.min(100,Math.max(0,percent))}%`;
    document.getElementById('progress-bar').setAttribute('aria-label',`Reading goal progress: ${percent}%`);
    document.getElementById('progress').textContent=`${year.read}/${year.goal}`;
    document.getElementById('progress-label').textContent='books read';
    document.getElementById('chart-desc').textContent=`${labelForYear(label)}: ${year.read} of ${year.goal} books read. Genre breakdown: ${genreRows.map(x=>x.join(' ')).join(', ')}.`;
    document.getElementById('list-title').textContent=`${labelForYear(label)} Read List`;
    document.getElementById('book-count').textContent=`${books.length} titles`;
    list.innerHTML='';
    if(!books.length){list.innerHTML='<div class="empty">No titles for this year.</div>';return;}
    books.forEach(book=>{
      const row=document.createElement('article'); row.className='row';
      const number=book.number??'—'; const meta=[book.author,book.genres.join(' · ')].filter(Boolean).join(' · ');
      row.innerHTML=`<div class="num">${escapeHtml(String(number))}</div><a class="row-link" href="${book.url}" target="_blank" rel="noopener"><div class="book-title">${escapeHtml(book.title)}</div><div class="book-meta">${escapeHtml(meta)}</div></a>`;
      list.appendChild(row);
    });
  }
  function escapeHtml(value){return value.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));}
  yearOrder.filter(y=>yearMap.has(y)).forEach(label=>{const btn=document.createElement('button');btn.className='year-btn';btn.type='button';btn.dataset.year=label;btn.textContent=labelForYear(label);btn.setAttribute('aria-pressed','false');btn.addEventListener('click',()=>render(label));buttons.appendChild(btn)});
  render(yearMap.has('2026')?'2026':yearOrder.find(y=>yearMap.has(y)));
})();
</script>
